<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="etch-a-sketch.js" defer></script>
</head>
<body>
    <h1>Etch a Sketch!</h1>
    <h3>Create a new grid that has:</h3>
    <div id="inputs">
        <div>
            <input type="number" min="1" max="99" value="20" id="input-grid-row"></input>
            <label for="input-grid-row"> rows, and</label>
        </div>
        <div>
            <input type="number" min="1" max="99" value="20" id="input-grid-column"></input>
            <label for="input-grid-column"> columns.</label>
        </div>
    </div>

    <button id="create-grid-btn">Create New Grid</button>
    <div id="grid"></div>
</body>
</html>
